[package]
name = "herdr-auto-titles"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Independent automatic task titles for Herdr desktop"
repository = "https://github.com/mustafaTokmak/herdr-auto-titles"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
wait-timeout = "0.2"
fs2 = "0.4"

[profile.release]
strip = true
lto = "thin"
